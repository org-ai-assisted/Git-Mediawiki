---
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perlcritic:
    ## CI runs only where we enabled it (org variable). Unset upstream / on a
    ## fork -> skipped, no runner, run stays green.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Perl critic
        uses: Difegue/action-perlcritic@d7e751eb07c818ee735b2b0cd03c6974bb7d0d5b  # v2.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: --stern ./Git/* ./t/*.pl ./git-*

  editorconfig:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Editorconfig
        uses: zbeekman/EditorConfig-Action@ad87de68f3718e100afb65800195b08ea44b7d9e  # v1.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
